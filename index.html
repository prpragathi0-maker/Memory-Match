
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sweet Pairs 🎀</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 14px;
      font-family: "Trebuchet MS", Arial, sans-serif;
      background: linear-gradient(135deg, #fff0f5, #f0eaff, #e8faff);
      color: #76546e;
      text-align: center;
    }

    .game {
      width: 100%;
      max-width: 440px;
      margin: auto;
      padding: 25px 18px;
      border: 2px solid #ffffff;
      border-radius: 30px;
      background: rgba(255, 255, 255, 0.78);
      box-shadow: 0 12px 35px #c9a8d633;
    }

    .decor {
      font-size: 25px;
      letter-spacing: 8px;
    }

    h1 {
      margin: 10px 0 5px;
      color: #d477a7;
      font-size: clamp(30px, 8vw, 39px);
    }

    .subtitle {
      margin: 0 0 22px;
      color: #9c83a5;
      font-size: 14px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 20px;
    }

    .stat {
      padding: 12px 4px;
      border-radius: 16px;
      background: #fff0f6;
    }

    .stat:nth-child(2) {
      background: #f1edff;
    }

    .stat:nth-child(3) {
      background: #eafaff;
    }

    .stat-label {
      display: block;
      margin-bottom: 5px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .stat strong {
      font-size: 21px;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 9px;
    }

    .card {
      aspect-ratio: 1;
      min-width: 0;
      padding: 0;
      border: 2px solid #f5d5e7;
      border-radius: 17px;
      background: #ffe4f0;
      font-size: clamp(25px, 8vw, 36px);
      cursor: pointer;
      transition: transform 0.18s, background 0.18s;
      -webkit-tap-highlight-color: transparent;
    }

    .card:hover:not(:disabled) {
      transform: translateY(-3px);
    }

    .card .face {
      display: none;
    }

    .card.flipped,
    .card.matched {
      background: #fff;
      border-color: #d7c5ff;
      cursor: default;
    }

    .card.flipped .back,
    .card.matched .back {
      display: none;
    }

    .card.flipped .face,
    .card.matched .face {
      display: inline;
    }

    .card.matched {
      background: #e8fff2;
      border-color: #b7e8ce;
      animation: pop 0.25s ease;
    }

    @keyframes pop {
      50% { transform: scale(1.08); }
    }

    .message {
      min-height: 27px;
      margin: 18px 0 8px;
      color: #c46d9b;
      font-size: 14px;
      font-weight: bold;
    }

    .restart {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 18px;
      background: #e7d9ff;
      color: #74558c;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s, background 0.2s;
    }

    .restart:hover {
      background: #d9c5ff;
      transform: scale(1.02);
    }

    .footer {
      margin-top: 19px;
      color: #b28ba9;
      font-size: 12px;
    }

    .card:focus-visible,
    .restart:focus-visible {
      outline: 3px solid #b68de5;
      outline-offset: 3px;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <main class="game">
    <div class="decor" aria-hidden="true">🎀 ✨ 🌷</div>

    <h1>Sweet Pairs</h1>
    <p class="subtitle">A little game for your lovely brain ♡</p>

    <section class="stats" aria-label="Game statistics">
      <div class="stat">
        <span class="stat-label">⏰ Time</span>
        <strong id="time">00:00</strong>
      </div>

      <div class="stat">
        <span class="stat-label">🎯 Moves</span>
        <strong id="moves">0</strong>
      </div>

      <div class="stat">
        <span class="stat-label">💗 Pairs</span>
        <strong id="pairs">0/6</strong>
      </div>
    </section>

    <section
      class="board"
      id="board"
      aria-label="Memory matching cards"
    ></section>

    <p class="message" id="message" aria-live="polite">
      Find all 6 matching pairs! 💕
    </p>

    <button class="restart" id="restart" type="button">
      ↻ Play Again
    </button>

    <p class="footer">made with ♡ and a little bit of magic</p>
  </main>

  <script>
    const emojis = ["🐻", "🍓", "🌷", "🦋", "🍒", "🐰"];

    const board = document.getElementById("board");
    const timeDisplay = document.getElementById("time");
    const movesDisplay = document.getElementById("moves");
    const pairsDisplay = document.getElementById("pairs");
    const message = document.getElementById("message");
    const restartButton = document.getElementById("restart");

    let firstCard = null;
    let secondCard = null;
    let lockBoard = false;
    let moves = 0;
    let matchedPairs = 0;
    let seconds = 0;
    let timer = null;
    let started = false;

    function shuffle(cards) {
      for (let i = cards.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [cards[i], cards[j]] = [cards[j], cards[i]];
      }
      return cards;
    }

    function formatTime(totalSeconds) {
      const minutes = Math.floor(totalSeconds / 60);
      const secs = totalSeconds % 60;

      return String(minutes).padStart(2, "0") + ":" +
             String(secs).padStart(2, "0");
    }

    function startTimer() {
      if (started) return;

      started = true;
      timer = setInterval(() => {
        seconds++;
        timeDisplay.textContent = formatTime(seconds);
      }, 1000);
    }

    function createCard(emoji, index) {
      const card = document.createElement("button");

      card.type = "button";
      card.className = "card";
      card.dataset.emoji = emoji;
      card.setAttribute("aria-label", "Hidden card " + (index + 1));

      card.innerHTML = `
        <span class="back" aria-hidden="true">♡</span>
        <span class="face" aria-hidden="true">${emoji}</span>
      `;

      card.addEventListener("click", () => flipCard(card));

      return card;
    }

    function flipCard(card) {
      if (
        lockBoard ||
        card === firstCard ||
        card.classList.contains("matched") ||
        card.classList.contains("flipped")
      ) {
        return;
      }

      startTimer();

      card.classList.add("flipped");
      card.setAttribute("aria-label", card.dataset.emoji);

      if (!firstCard) {
        firstCard = card;
        message.textContent = "Find its matching pair! 💫";
        return;
      }

      secondCard = card;
      moves++;
      movesDisplay.textContent = moves;

      if (firstCard.dataset.emoji === secondCard.dataset.emoji) {
        firstCard.classList.add("matched");
        secondCard.classList.add("matched");

        firstCard.disabled = true;
        secondCard.disabled = true;

        matchedPairs++;
        pairsDisplay.textContent = matchedPairs + "/6";

        message.textContent = "Yay! A matching pair! 💗";

        resetTurn();

        if (matchedPairs === emojis.length) {
          clearInterval(timer);
          timer = null;

          message.textContent =
            "🎉 You won! " + moves + " moves in " +
            formatTime(seconds) + "! You're amazing!";

          board.querySelectorAll(".card").forEach(card => {
            card.disabled = true;
          });
        }
      } else {
        lockBoard = true;
        message.textContent = "Not a match! Try again 🌸";

        const first = firstCard;
        const second = secondCard;

        setTimeout(() => {
          first.classList.remove("flipped");
          second.classList.remove("flipped");

          first.setAttribute("aria-label", "Hidden card");
          second.setAttribute("aria-label", "Hidden card");

          resetTurn();
        }, 800);
      }
    }

    function resetTurn() {
      firstCard = null;
      secondCard = null;
      lockBoard = false;
    }

    function initGame() {
      clearInterval(timer);
      timer = null;

      firstCard = null;
      secondCard = null;
      lockBoard = false;
      moves = 0;
      matchedPairs = 0;
      seconds = 0;
      started = false;

      timeDisplay.textContent = "00:00";
      movesDisplay.textContent = "0";
      pairsDisplay.textContent = "0/6";
      message.textContent = "Find all 6 matching pairs! 💕";

      const cards = shuffle([...emojis, ...emojis]);

      board.innerHTML = "";

      cards.forEach((emoji, index) => {
        board.appendChild(createCard(emoji, index));
      });
    }

    restartButton.addEventListener("click", initGame);

    initGame();
  </script>
</body>
</html>
